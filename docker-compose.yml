# Infraestrutura local de desenvolvimento e testes (não é usado em produção).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rotas
      POSTGRES_PASSWORD: rotas_dev
      POSTGRES_DB: rotas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotas -d rotas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
